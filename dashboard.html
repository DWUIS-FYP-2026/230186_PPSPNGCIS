<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/auth-guard.js"></script>
  <title>PMS Dashboard</title>
  <link rel="icon" type="image/jpeg" href="images/NationalEmblem.jpg">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1a2332;
    }
    .hub-card {
      width: min(420px, calc(100vw - 2rem));
      padding: 2rem;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .hub-spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 1rem;
      border: 3px solid #e2e8f0;
      border-top-color: #1e5a8a;
      border-radius: 50%;
      animation: hub-spin 0.8s linear infinite;
    }
    @keyframes hub-spin { to { transform: rotate(360deg); } }
    #hub-status { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.5rem; }
    #hub-detail { font-size: 0.9rem; color: #64748b; margin: 0; min-height: 1.25rem; }
    #hub-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }
    .hub-btn {
      display: inline-block;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .hub-btn--primary { background: #1e5a8a; color: #fff; }
    .hub-btn--secondary { background: #e2e8f0; color: #1a2332; }
  </style>
</head>
<body>
  <div class="hub-card" role="status" aria-live="polite">
    <div class="hub-spinner" id="hub-spinner" aria-hidden="true"></div>
    <p id="hub-status">Loading your workspace…</p>
    <p id="hub-detail">Preparing your dashboard</p>
    <div id="hub-actions" hidden></div>
  </div>
  <script src="js/id-generator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/rbac.js"></script>
  <script src="js/dashboard-hub.js"></script>
  <script>PMSDashboardHub.route();</script>
</body>
</html>
