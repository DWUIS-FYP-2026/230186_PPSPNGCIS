<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="images/NationalEmblem.jpg">
  <script src="js/auth-guard.js"></script>
  <title>Jail Commander Details — PMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/dashboard.css" rel="stylesheet">
  <link href="css/institutions.css" rel="stylesheet">
</head>
<body>
  <header class="inst-page-header">
    <div class="container-fluid px-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 py-2">
        <div>
          <div class="brand-line">Papua New Guinea Correctional Service</div>
          <h1>Jail Commander Profile</h1>
          <p class="subtitle mb-0" id="page-subtitle">Institutional leadership and facility overview</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <a href="institutions.html" class="btn btn-pms-outline btn-sm">← Institutions</a>
          <a href="#" class="btn btn-pms-outline btn-sm" id="back-dashboard">Dashboard</a>
          <button type="button" class="btn btn-pms-gold btn-sm d-none" id="btn-edit-commander">Edit Profile</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container-fluid px-4 py-4" id="main-content">
    <p class="text-center text-muted py-5">Loading commander profile…</p>
  </main>

  <!-- Edit Commander Modal (Admin) -->
  <div class="modal fade" id="editCommanderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="edit-commander-form">
          <div class="modal-header pms-modal-header">
            <h5 class="modal-title">Edit Jail Commander Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="cmd-id">
            <div class="row g-3">
              <div class="col-md-4"><label class="form-label">Officer ID</label><input class="form-control" id="cmd-officer-id" readonly></div>
              <div class="col-md-4"><label class="form-label">Employee Number</label><input class="form-control field-auto-id" id="cmd-employee-no" readonly tabindex="-1" placeholder="Automatically Generated"></div>
              <div class="col-md-4"><label class="form-label">Rank</label><input class="form-control" id="cmd-rank" value="Jail Commander" readonly></div>
              <div class="col-md-6"><label class="form-label">First Name *</label><input class="form-control" id="cmd-first" required></div>
              <div class="col-md-6"><label class="form-label">Last Name *</label><input class="form-control" id="cmd-last" required></div>
              <div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" id="cmd-username" required></div>
              <div class="col-md-6"><label class="form-label">Official Email *</label><input type="email" class="form-control" id="cmd-email" required></div>
              <div class="col-md-6"><label class="form-label">Contact Number *</label><input class="form-control" id="cmd-phone" required></div>
              <div class="col-md-6"><label class="form-label">Date Appointed</label><input type="date" class="form-control" id="cmd-appointed"></div>
              <div class="col-md-6"><label class="form-label">Assigned Institution *</label><select class="form-select" id="cmd-institution" required></select></div>
              <div class="col-md-6"><label class="form-label">Province</label><input class="form-control" id="cmd-province" readonly></div>
              <div class="col-md-4"><label class="form-label">Employment Status</label><select class="form-select" id="cmd-employment"><option>Active</option><option>Inactive</option></select></div>
              <div class="col-md-4"><label class="form-label">Account Status</label><select class="form-select" id="cmd-account"><option>Active</option><option>Suspended</option><option>Inactive</option></select></div>
              <div class="col-md-4"><label class="form-label">System Status</label><select class="form-select" id="cmd-status"><option>Active</option><option>Inactive</option></select></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-pms-primary">Save Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/institutions-data.js"></script>
  <script src="js/commanders-data.js"></script>
  <script src="js/id-generator.js"></script>
  <script src="js/eligibility-engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/commander-details.js"></script>
</body>
</html>
