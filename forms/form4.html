<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../images/NationalEmblem.jpg">
  <script src="../js/auth-guard.js"></script>
  <title>Form 4 — Pre-Parole Investigation Report | PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/forms.css" rel="stylesheet">
</head>
<body class="form-page">
  <header class="form-page-header">
    <div class="container">
      <div class="brand-line">PNG Correctional Service · Department of Justice & Attorney General</div>
      <h1>Form 4 — Pre-Parole Investigation Report</h1>
      <small>Completed by: DJAG Parole Clerk · Workflow Step 9</small>
    </div>
  </header>
  <main class="container pb-5">
    <div class="form-meta-bar" id="form-meta"></div>
    <form id="parole-form" novalidate>
      <div class="form-card">
        <div class="form-card-header">Section A — Investigation Details</div>
        <div class="form-card-body row g-3">
          <div class="col-md-4"><label class="form-label">Prisoner Number</label><input class="form-control readonly-field" data-readonly-prisoner="prisonerNumber" readonly></div>
          <div class="col-md-4"><label class="form-label">Name</label><input class="form-control readonly-field" id="prisoner-full-name" readonly></div>
          <div class="col-md-4"><label class="form-label">Investigation Date *</label><input type="date" class="form-control" data-field="investigationDate" required></div>
          <div class="col-md-6"><label class="form-label">Investigating Officer (DJAG) *</label><input class="form-control" data-field="investigatingOfficer" required></div>
          <div class="col-md-6"><label class="form-label">Institution</label><input class="form-control readonly-field" id="institution-name" readonly></div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">Section B — Community & Release Planning</div>
        <div class="form-card-body row g-3">
          <div class="col-md-6"><label class="form-label">Community Support *</label><textarea class="form-control" rows="3" data-field="communitySupport" required placeholder="Family, community leaders, church, or employer support…"></textarea></div>
          <div class="col-md-6"><label class="form-label">Proposed Release Address *</label><textarea class="form-control" rows="3" data-field="proposedReleaseAddress" required></textarea></div>
          <div class="col-md-6"><label class="form-label">Employment Prospects</label><textarea class="form-control" rows="2" data-field="employmentProspects"></textarea></div>
          <div class="col-md-6"><label class="form-label">Victim Impact Consideration</label><textarea class="form-control" rows="2" data-field="victimImpactConsideration"></textarea></div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">Section C — Assessment & Recommendation *</div>
        <div class="form-card-body row g-3">
          <div class="col-md-6"><label class="form-label">Risk Assessment *</label><select class="form-select" data-field="riskAssessment" required><option value="">Select…</option><option>Low</option><option>Moderate</option><option>High</option></select></div>
          <div class="col-md-6"><label class="form-label">DJAG Recommendation *</label><select class="form-select" data-field="djagRecommendation" required><option value="">Select…</option><option>Recommend for Parole</option><option>Recommend with Conditions</option><option>Not Recommend for Parole</option></select></div>
          <div class="col-12"><label class="form-label">Investigation Summary *</label><textarea class="form-control" rows="5" data-field="investigationSummary" required placeholder="Comprehensive pre-parole investigation findings…"></textarea></div>
        </div>
      </div>
    </form>
    <div class="form-actions-bar no-print">
      <div class="container d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-pms-primary" id="btn-save">Save Form</button>
        <button type="button" class="btn btn-pms-success" id="btn-complete">Complete & Mark Report Prepared</button>
        <button type="button" class="btn btn-pms-outline" id="btn-print">Print</button>
        <button type="button" class="btn btn-pms-outline" id="btn-export">Export PDF</button>
        <button type="button" class="btn btn-outline-secondary" id="btn-back">Back to Dashboard</button>
      </div>
    </div>
  </main>
  <script src="../js/id-generator.js"></script><script src="../js/eligibility-engine.js"></script><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/rbac.js"></script><script src="../js/ui-shared.js"></script><script src="../js/workflow.js"></script><script src="../js/forms-engine.js"></script>
  <script>
    const ctx = PMSForms.init(4);
    if (ctx) {
      PMSForms.populateMeta(ctx);
      document.getElementById('institution-name').value = ctx.institution?.name || '';
      document.getElementById('prisoner-full-name').value = `${ctx.prisoner.firstName} ${ctx.prisoner.lastName}`;
      PMSForms.loadIntoForm('form4', ctx.app.formData?.form4, ctx.prisoner);
      const invDate = document.querySelector('[data-field="investigationDate"]');
      const invOff = document.querySelector('[data-field="investigatingOfficer"]');
      if (!invDate.value) invDate.value = new Date().toISOString().split('T')[0];
      if (!invOff.value) invOff.value = `${ctx.user.firstName} ${ctx.user.lastName}`;
      PMSForms.setReadOnlyIfViewOnly(ctx, 4);
      PMSForms.bindCommonActions(ctx, 'form4');
      document.getElementById('btn-complete')?.addEventListener('click', () => {
        if (!document.getElementById('parole-form').checkValidity()) { document.getElementById('parole-form').reportValidity(); return; }
        PMSForms.save('form4', ctx);
        try {
          if (['Under DJAG Review', 'Submitted'].includes(ctx.app.status)) {
            PMSStorage.transitionApplication(ctx.appId, 'Under DJAG Review', ctx.user, 'DJAG commenced review');
          }
          PMSStorage.transitionApplication(ctx.appId, 'Pre-Parole Report Prepared', ctx.user, 'Form 4 Pre-Parole Investigation Report completed');
          alert('Pre-Parole Report marked as prepared.');
          window.location.href = PMSAuth.getDashboardForRole(ctx.user.role);
        } catch (e) { alert(e.message); }
      });
    }
  </script>
</body>
</html>
