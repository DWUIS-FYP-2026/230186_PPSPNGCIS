<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../images/NationalEmblem.jpg">
  <script src="../js/auth-guard.js"></script>
  <title>Form 3 — Institutional Report | PMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/forms.css" rel="stylesheet">
</head>
<body class="form-page">
  <header class="form-page-header">
    <div class="container">
      <div class="brand-line">PNG Correctional Service · Department of Justice & Attorney General</div>
      <h1>Form 3 — Institutional Report</h1>
      <small>Completed by: Jail Commander · Workflow Step 5</small>
    </div>
  </header>
  <main class="container pb-5">
    <div class="form-meta-bar" id="form-meta"></div>
    <form id="parole-form" novalidate>
      <div class="form-card">
        <div class="form-card-header">Section A — Institutional Record</div>
        <div class="form-card-body row g-3">
          <div class="col-md-4"><label class="form-label">Prisoner Number</label><input class="form-control readonly-field" data-readonly-prisoner="prisonerNumber" readonly></div>
          <div class="col-md-4"><label class="form-label">Name</label><input class="form-control readonly-field" id="prisoner-full-name" readonly></div>
          <div class="col-md-4"><label class="form-label">Institution</label><input class="form-control readonly-field" id="institution-name" readonly></div>
          <div class="col-md-4"><label class="form-label">Date of Admission *</label><input type="date" class="form-control" data-field="dateOfAdmission" required></div>
          <div class="col-md-8"><label class="form-label">Conduct During Sentence *</label><textarea class="form-control" rows="3" data-field="conductDuringSentence" required placeholder="General conduct, attitude, and compliance with institutional rules…"></textarea></div>
          <div class="col-12"><label class="form-label">Disciplinary Record</label><textarea class="form-control" rows="2" data-field="disciplinaryRecord" placeholder="List any disciplinary incidents or state 'None recorded'…"></textarea></div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">Section B — Programs & Rehabilitation</div>
        <div class="form-card-body row g-3">
          <div class="col-md-6"><label class="form-label">Program Participation *</label><textarea class="form-control" rows="3" data-field="programParticipation" required placeholder="Rehabilitation, vocational, or educational programs…"></textarea></div>
          <div class="col-md-6"><label class="form-label">Work Assignment</label><textarea class="form-control" rows="3" data-field="workAssignment"></textarea></div>
          <div class="col-md-6"><label class="form-label">Mental Health Assessment</label><textarea class="form-control" rows="2" data-field="mentalHealthAssessment"></textarea></div>
          <div class="col-md-6"><label class="form-label">Medical Assessment</label><textarea class="form-control" rows="2" data-field="medicalAssessment"></textarea></div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">Section C — Commander Recommendation *</div>
        <div class="form-card-body row g-3">
          <div class="col-12"><label class="form-label">Institutional Recommendation *</label><textarea class="form-control" rows="4" data-field="commanderRecommendation" required placeholder="Jail Commander's recommendation regarding parole suitability…"></textarea></div>
          <div class="col-md-6"><label class="form-label">Jail Commander Name *</label><input class="form-control" data-field="commanderName" required></div>
          <div class="col-md-6"><label class="form-label">Signature Date *</label><input type="date" class="form-control" data-field="commanderSignatureDate" required></div>
        </div>
      </div>
    </form>
    <div class="form-actions-bar no-print">
      <div class="container d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-pms-primary" id="btn-save">Save Form</button>
        <button type="button" class="btn btn-pms-outline" id="btn-print">Print</button>
        <button type="button" class="btn btn-pms-outline" id="btn-export">Export PDF</button>
        <button type="button" class="btn btn-outline-secondary" id="btn-back">Back to Dashboard</button>
      </div>
    </div>
  </main>
  <script src="../js/id-generator.js"></script><script src="../js/eligibility-engine.js"></script><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/rbac.js"></script><script src="../js/ui-shared.js"></script><script src="../js/workflow.js"></script><script src="../js/forms-engine.js"></script>
  <script>
    const ctx = PMSForms.init(3);
    if (ctx) {
      PMSForms.populateMeta(ctx);
      document.getElementById('institution-name').value = ctx.institution?.name || '';
      document.getElementById('prisoner-full-name').value = `${ctx.prisoner.firstName} ${ctx.prisoner.lastName}`;
      PMSForms.loadIntoForm('form3', ctx.app.formData?.form3, ctx.prisoner);
      if (!document.querySelector('[data-field="commanderName"]').value) document.querySelector('[data-field="commanderName"]').value = `${ctx.user.firstName} ${ctx.user.lastName}`;
      if (!document.querySelector('[data-field="commanderSignatureDate"]').value) document.querySelector('[data-field="commanderSignatureDate"]').value = new Date().toISOString().split('T')[0];
      PMSForms.setReadOnlyIfViewOnly(ctx, 3);
      PMSForms.bindCommonActions(ctx, 'form3');
    }
  </script>
</body>
</html>
