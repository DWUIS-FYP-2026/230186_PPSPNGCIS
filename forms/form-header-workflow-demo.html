<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form 2 — Assessment Reports | PMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Design system
       ============================================================ */
    :root {
      --primary-navy: #0f2942;
      --light-bg: #f8f9fa;
      --border-color: #e2e8f0;
      --text-main: #1a202c;
      --text-muted: #4a5568;
      --btn-border: #cbd5e1;

      /* Workflow step — completed (Form 1) */
      --step-complete-bg: #f0fdf4;
      --step-complete-text: #166534;
      --step-complete-border: #bbf7d0;

      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-btn: 0 1px 2px rgb(15 41 66 / 0.06), 0 1px 3px rgb(15 41 66 / 0.08);
      --shadow-btn-hover: 0 2px 6px rgb(15 41 66 / 0.1), 0 2px 4px rgb(15 41 66 / 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background: var(--light-bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       Top navigation bar
       ============================================================ */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
    }

    /* Dashboard button — structured, not pill-shaped */
    .dashboard-btn {
      display: inline-flex;
      align-items: stretch;
      min-height: 2.625rem;
      padding: 0;
      border: 1px solid var(--btn-border);
      border-radius: var(--radius-sm);
      background: #fff;
      box-shadow: var(--shadow-btn);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      color: var(--text-main);
      transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .dashboard-btn:hover {
      background: var(--light-bg);
      box-shadow: var(--shadow-btn-hover);
      border-color: var(--border-color);
    }

    .dashboard-btn:focus-visible {
      outline: 2px solid var(--primary-navy);
      outline-offset: 2px;
    }

    .dashboard-btn__icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.625rem;
      flex-shrink: 0;
      background: var(--light-bg);
      border-right: 1px solid var(--btn-border);
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      color: var(--primary-navy);
    }

    .dashboard-btn__icon-box svg {
      width: 1.125rem;
      height: 1.125rem;
      display: block;
    }

    .dashboard-btn__label {
      display: flex;
      align-items: center;
      padding: 0 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    /* Form badge — right side */
    .form-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.4375rem 0.875rem;
      background: var(--primary-navy);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: var(--radius-sm);
      line-height: 1;
    }

    /* ============================================================
       Main document header (letterhead)
       ============================================================ */
    .letterhead {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 32px 48px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
    }

    .letterhead__logo {
      flex-shrink: 0;
      width: 5.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .letterhead__logo--right {
      justify-content: flex-end;
    }

    .letterhead__emblem {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: var(--light-bg);
    }

    .letterhead__emblem--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--primary-navy) 0%, #1a3d5c 100%);
      color: #fff;
      font-size: 0.625rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .letterhead__center {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .letterhead__title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 0.375rem;
    }

    .letterhead__subtitle {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 0.875rem;
    }

    .letterhead__meta-pill {
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--light-bg);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.01em;
    }

    /* ============================================================
       Form body & workflow
       ============================================================ */
    .form-body {
      padding: 32px;
      background: #fff;
      min-height: 12rem;
    }

    .workflow-box {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      background: #fff;
    }

    .workflow-box__title {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .workflow-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      list-style: none;
    }

    .workflow-step {
      flex: 1 1 0;
      min-width: 7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--light-bg);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
    }

    /* Completed step — Form 1 */
    .workflow-step--complete {
      background: var(--step-complete-bg);
      color: var(--step-complete-text);
      border-color: var(--step-complete-border);
    }

    .workflow-step__check {
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Active step — Form 2 */
    .workflow-step--active {
      background: var(--primary-navy);
      color: #fff;
      border-color: var(--primary-navy);
    }

    /* ============================================================
       Responsive — mobile
       ============================================================ */
    @media (max-width: 768px) {
      .top-nav {
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
      }

      .dashboard-btn__label {
        font-size: 0.8125rem;
        padding: 0 0.75rem;
        white-space: normal;
      }

      .letterhead {
        flex-direction: column;
        padding: 24px 20px;
        text-align: center;
      }

      .letterhead__logo,
      .letterhead__logo--right {
        width: 100%;
        justify-content: center;
      }

      .letterhead__center {
        order: -1;
      }

      .letterhead__title {
        font-size: 1.375rem;
      }

      .letterhead__subtitle {
        font-size: 0.875rem;
      }

      .form-body {
        padding: 20px 16px;
      }

      .workflow-box {
        padding: 16px;
      }

      .workflow-steps {
        flex-direction: column;
      }

      .workflow-step {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       1. Top navigation bar
       ============================================================ -->
  <header class="top-nav" role="banner">
    <a href="../dashboard.html" class="dashboard-btn" aria-label="Return to Dashboard">
      <span class="dashboard-btn__icon-box" aria-hidden="true">
        <!-- Inline SVG: grid / dashboard icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </span>
      <span class="dashboard-btn__label">Dashboard</span>
    </a>

    <span class="form-badge" aria-label="Current form">Form 2</span>
  </header>

  <!-- ============================================================
       2. Main document header (letterhead)
       ============================================================ -->
  <section class="letterhead" aria-labelledby="form-title">
    <!-- Left emblem -->
    <div class="letterhead__logo">
      <img class="letterhead__emblem" src="../images/PNG CS Logo.jpg" alt="PNG Correctional Service emblem">
    </div>

    <!-- Center title block -->
    <div class="letterhead__center">
      <h1 class="letterhead__title" id="form-title">Form 2 — Assessment Reports</h1>
      <p class="letterhead__subtitle">Pre-Parole Report (PPR) &amp; Detainee Assessment Report (DAR)</p>
      <p class="letterhead__meta-pill">Application ID: PMS-2026-000001</p>
    </div>

    <!-- Right emblem -->
    <div class="letterhead__logo letterhead__logo--right">
      <img class="letterhead__emblem" src="../images/djag_logo.jpg" alt="Department of Justice and Attorney General emblem">
    </div>
  </section>

  <!-- ============================================================
       3. Form body & parole case workflow
       ============================================================ -->
  <main class="form-body">
    <section class="workflow-box" aria-labelledby="workflow-title">
      <h2 class="workflow-box__title" id="workflow-title">Parole Case Workflow</h2>

      <ol class="workflow-steps" role="list">
        <li class="workflow-step workflow-step--complete" aria-current="false">
          <span class="workflow-step__check" aria-hidden="true">✓</span>
          <span>Form 1</span>
        </li>
        <li class="workflow-step workflow-step--active" aria-current="step">
          <span>Form 2</span>
        </li>
        <li class="workflow-step" aria-current="false">
          <span>Form 3</span>
        </li>
        <li class="workflow-step" aria-current="false">
          <span>Form 4</span>
        </li>
        <li class="workflow-step" aria-current="false">
          <span>Form 5</span>
        </li>
      </ol>
    </section>
  </main>

</body>
</html>
