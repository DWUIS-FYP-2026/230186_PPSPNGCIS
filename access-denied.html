<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5, user-scalable=yes">
  <script src="js/page-zoom.js"></script>
  <link rel="icon" type="image/jpeg" href="images/NationalEmblem.jpg">
  <title>Access Denied — PMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="access-page">
    <div class="access-card">
      <div class="access-code" id="access-code">403</div>
      <h1>Access Denied</h1>
      <p id="access-message">You do not have permission to access this resource.</p>
      <div class="access-actions">
        <a href="#" class="btn-primary" id="btn-dashboard">Return to Dashboard</a>
        <a href="index.html" class="btn-secondary">Sign Out</a>
      </div>
    </div>
  </div>
  <script src="js/eligibility-engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      await PMSStorage.ensureLoaded();
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || '403';
      const msg = params.get('msg');
      const ret = params.get('return');
      document.getElementById('access-code').textContent = code;
      if (msg) document.getElementById('access-message').textContent = decodeURIComponent(msg.replace(/\+/g, ' '));
      const session = PMSStorage.getSession();
      const dash = ret || PMSAuth.getDashboardForRole(session?.role || '');
      document.getElementById('btn-dashboard').href = dash || 'index.html';
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
